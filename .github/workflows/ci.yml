name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Corepack provides the yarn version pinned in package.json's packageManager
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint and typecheck
        run: yarn biome ci . && yarn tsc

      - name: Run tests
        run: yarn vitest run

      - name: Build
        run: yarn build

      - name: Typecheck and build docs site
        run: yarn workspace serenity-now-website build
