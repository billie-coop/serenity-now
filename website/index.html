<!doctype html>
<html lang="en" class="dark" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="color-scheme" content="dark light" />
		<!-- Paint the saved theme before the app stylesheet or React loads. -->
		<style>
			:root { color-scheme: dark; background: #191d24; color: #f1f3f5; }
			:root[data-theme="light"] { color-scheme: light; background: #fafbfc; color: #20252d; }
		</style>
		<script>
			(() => {
				let theme = "dark";
				try {
					if (localStorage.getItem("billie-coop-theme") === "light") theme = "light";
				} catch {
					// Storage can be unavailable; dark remains the default.
				}
				const root = document.documentElement;
				root.dataset.theme = theme;
				root.classList.toggle("dark", theme === "dark");
				root.style.colorScheme = theme;
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>serenity-now: keep TypeScript monorepo dependencies in sync</title>
		<meta
			name="description"
			content="serenity-now keeps workspace dependencies, tsconfig paths and project references in sync with the imports your TypeScript monorepo actually uses. Run it with npx @billie-coop/serenity-now."
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
